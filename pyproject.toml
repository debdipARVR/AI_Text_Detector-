[project]
name = "ai-text-detector"
version = "1.0.0"
description = "Cloze-Congruence AI Text Detection & Humanization Engine powered by NVIDIA NIM & Fernet Security"
authors = [
    {name = "debdipARVR", email = "debdip@outlook.com"}
]
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "openai>=1.14.0",
    "python-dotenv>=1.0.0",
    "rapidfuzz>=3.6.0",
    "jinja2>=3.1.3",
    "pydantic>=2.6.0",
    "scipy>=1.12.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
