name: CI - AI Text Detector Test Suite

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Run Pytest & Encryption Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Verify Secret Safety (No Keys Committed)
        run: |
          if [ -f .env ]; then
            echo "ERROR: .env file found in repository! Keys must not be committed."
            exit 1
          fi
          echo "Secret check passed: No .env committed."

      - name: Run Test Suite with Encrypted Secrets
        env:
          FERNET_SECRET_KEY: ${{ secrets.FERNET_SECRET_KEY }}
          FERNET_ENCRYPTED_NVIDIA_API_KEY: ${{ secrets.FERNET_ENCRYPTED_NVIDIA_API_KEY }}
        run: |
          pytest tests/ -v

      - name: Validate CLI & Encryption Tool
        run: |
          python scripts/encrypt_credentials.py genkey
          python scripts/encrypt_credentials.py encrypt --api-key "nvapi-ci-test-key"
